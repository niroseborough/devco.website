<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Redirecting — DevCo</title>
    <script>
      const routes = {
        "/about": "about",
        "/about/": "about",
        "/services": "services",
        "/services/": "services",
        "/projects": "projects",
        "/projects/": "projects",
        "/contact": "contact",
        "/contact/": "contact"
      };
      const page = routes[window.location.pathname] || "";
      window.location.replace(page ? `/#${page}` : "/");
    </script>
  </head>
  <body>
    <p><a href="/">Continue to DevCo.</a></p>
  </body>
</html>
